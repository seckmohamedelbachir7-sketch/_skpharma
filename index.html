<!-- FRAGMENT 1 : Remplace le contenu de <div id="tab-login">     -->
<!-- ============================================================ -->
<div id="tab-login">
  <div class="form-group">
    <label class="form-label">Adresse e-mail</label>
    <input class="form-input" type="email" id="login-email" placeholder="pharmacien@exemple.fr"/>
  </div>
  <div class="form-group">
    <label class="form-label">Mot de passe</label>
    <input class="form-input" type="password" id="login-pwd" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')doLogin()"/>
  </div>
  <div style="text-align:right;margin-bottom:12px">
    <span onclick="showForgotPassword()"
      style="font-size:12px;color:var(--teal);cursor:pointer;text-decoration:underline">
      Mot de passe oublié ?
    </span>
  </div>
  <button class="auth-btn" onclick="doLogin()">Se connecter</button>
  <div class="auth-msg" id="login-msg"></div>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT 2 : Ajoute juste APRÈS <div id="tab-login">...</div>-->
<!-- ============================================================ -->
<div id="tab-forgot" style="display:none">
  <div style="text-align:center;margin-bottom:20px">
    <div style="font-size:32px;margin-bottom:8px">🔑</div>
    <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">Mot de passe oublié</div>
    <div style="font-size:12px;color:var(--text-muted)">
      Entrez votre email et nous vous enverrons un lien de réinitialisation.
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Adresse e-mail</label>
    <input class="form-input" type="email" id="forgot-email" placeholder="pharmacien@exemple.fr"
      onkeydown="if(event.key==='Enter')doForgotPassword()"/>
  </div>
  <button class="auth-btn" id="forgot-btn" onclick="doForgotPassword()">Envoyer le lien</button>
  <div class="auth-msg" id="forgot-msg"></div>
  <div style="text-align:center;margin-top:14px">
    <span onclick="hideForgotPassword()"
      style="font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:underline">
      ← Retour à la connexion
    </span>
  </div>
</div>

<!-- FRAGMENT 3 : Modal reset password                            -->
<!-- Ajoute juste AVANT </body> avec les autres modals            -->
<!-- ============================================================ -->
<div class="modal-overlay" id="modal-reset-pwd" style="z-index:600">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:24px">🔐</div>
        <div class="modal-title">Nouveau mot de passe</div>
      </div>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">
        Choisissez un nouveau mot de passe sécurisé pour votre compte.
      </div>
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <input class="form-input" type="password" id="reset-pwd" placeholder="8 caractères minimum"/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe</label>
        <input class="form-input" type="password" id="reset-pwd2" placeholder="Répétez le mot de passe"
          onkeydown="if(event.key==='Enter')doResetPassword()"/>
      </div>
      <div class="auth-msg" id="reset-msg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="reset-btn" onclick="doResetPassword()"
        style="width:100%">
        Enregistrer le nouveau mot de passe
      </button>
    </div>
  </div>
</div>
